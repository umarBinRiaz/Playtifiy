name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Seed Bubblewrap config
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" << EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": ""
          }
          EOF
          echo "Bubblewrap config:"
          cat "$HOME/.bubblewrap/config.json"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -keystore android.keystore \
            -alias playtifiy \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass playtifiy123 \
            -keypass playtifiy123 \
            -dname "CN=Playtifiy, O=Playtifiy, C=US" \
            -noprompt

      - name: Init TWA project
        run: |
          mkdir -p build/twa
          cd build/twa
          printf '\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n' | bubblewrap init --manifest https://umarbinriaz.github.io/Playtifiy/manifest.json

      - name: Build APK
        working-directory: build/twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: playtifiy123
          BUBBLEWRAP_KEY_PASSWORD: playtifiy123
        run: |
          bubblewrap build --skipPwaValidation || true
          find . -name "*.apk" -not -path "*/node_modules/*"

      - name: Find APK files
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -not -path "*/node_modules/*" 2>/dev/null
          echo "=== Searching in build/twa ==="
          ls -la build/twa/ 2>/dev/null || echo "build/twa not found"
          find build/ -name "*.apk" 2>/dev/null || echo "No APK in build/"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: playtifiy-android
          path: |
            build/twa/app-release-signed.apk
            build/twa/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/twa/app-release-signed.apk
            build/twa/app-debug.apk
          generate_release_notes: true
          body: |
            ## Playtifiy Android APK

            **Install on Android:**
            1. Download `app-release-signed.apk` below
            2. Open the APK file on your Android device
            3. Allow installation from unknown sources if prompted
            4. Install and enjoy!

            **Install on Android TV:**
            1. Transfer the APK to your TV via USB or file sharing
            2. Use a file manager to open the APK
            3. Install and launch Playtifiy

            **PWA Install (No APK needed):**
            Visit https://umarbinriaz.github.io/Playtifiy/ in Chrome on any device and tap "Install" or "Add to Home Screen".
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

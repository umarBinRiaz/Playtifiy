name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@1.24.1

      - name: Seed Bubblewrap config
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" << EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": ""
          }
          EOF

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -keystore android.keystore \
            -alias playtifiy \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass playtifiy123 \
            -keypass playtifiy123 \
            -dname "CN=Playtifiy, O=Playtifiy, C=US" \
            -noprompt

      - name: Create twa-manifest.json
        run: |
          mkdir -p build/twa
          cat > build/twa/twa-manifest.json << EOF
          {
            "packageId": "com.umarbinriaz.playtifiy",
            "name": "Playtifiy",
            "shortName": "Playtifiy",
            "startUrl": "https://umarbinriaz.github.io/Playtifiy/",
            "themeColor": "#07090c",
            "backgroundColor": "#07090c",
            "iconUrl": "https://umarbinriaz.github.io/Playtifiy/icons/icon-512.png",
            "maskableIconUrl": "https://umarbinriaz.github.io/Playtifiy/icons/icon-maskable-512.png",
            "monochromeIconUrl": "https://umarbinriaz.github.io/Playtifiy/icons/icon-192.png",
            "splashScreenColor": "#07090c",
            "navigationColor": "#07090c",
            "navigationColorDark": "#07090c",
            "navigationDividerColor": "#07090c",
            "navigationDividerColorDark": "#07090c",
            "signingKey": {
              "path": "../../android.keystore",
              "alias": "playtifiy",
              "keystorePassword": "playtifiy123",
              "keyPassword": "playtifiy123"
            },
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "appVersion": "1.0.0",
            "fallbackType": "custom-tabs",
            "useCaptivePortal": false,
            "enableNotifications": false,
            "isTriangleEnabled": false
          }
          EOF

      - name: Generate Android project from manifest
        working-directory: build/twa
        run: yes | bubblewrap update --skipVersionUpgrade

      - name: Build signed APK
        working-directory: build/twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: playtifiy123
          BUBBLEWRAP_KEY_PASSWORD: playtifiy123
        run: bubblewrap build --skipPwaValidation

      - name: Find APK files
        run: |
          echo "=== APK files ==="
          find build/ -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: playtifiy-android
          path: |
            build/twa/app-release-signed.apk
            build/twa/app-release-bundle.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/twa/app-release-signed.apk
            build/twa/app-release-bundle.aab
          generate_release_notes: true
          body: |
            ## Playtifiy Android APK

            **Install on Android:**
            1. Download `app-release-signed.apk` below
            2. Open the APK file on your Android device
            3. Allow installation from unknown sources if prompted
            4. Install and enjoy!

            **Install on Android TV:**
            1. Transfer the APK to your TV via USB or file sharing
            2. Use a file manager to open the APK
            3. Install and launch Playtifiy

            **PWA Install (No APK needed):**
            Visit https://umarbinriaz.github.io/Playtifiy/ in Chrome and tap "Install" or "Add to Home Screen".
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
